<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曦曦 · 五种动作试演</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ecf8;color:#000;font:16px "PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:32px}h1{font-size:30px;margin:0 0 12px}p{line-height:1.8}nav{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}button{font:inherit;border:1px solid #000;background:white;color:#000;border-radius:10px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#e3d5ff}.stage{display:grid;grid-template-columns:minmax(0,720px) 1fr;gap:24px;align-items:start}canvas{background:white;width:100%;display:block;border-radius:16px}.info{background:white;border-radius:16px;padding:22px}h2{margin:0 0 12px;font-size:23px}.controls{display:flex;gap:16px;align-items:center;margin:16px 0}input{flex:1;accent-color:#8054e8}small{font-size:13px;line-height:1.7}a{color:black}@media(max-width:800px){main{padding:20px}.stage{grid-template-columns:1fr}.info{padding:18px}}</style><main><h1>曦曦 · 五种动作试演</h1><p>点击切换动作。沿用原图姿态，测试连续形变、转头、手势与空间运动；无配音。<br>这里放大查看动作细节，插入课程时会进一步缩小。</p><nav id="choices"></nav><div class="stage"><div><canvas id="scene" width="640" height="500"></canvas><div class="controls"><button id="play">暂停</button><input id="seek" type="range" min="0" max="5.99" value="0" step="0.01"><output id="time">0.0秒</output><button id="again">重播</button></div></div><aside class="info"><h2 id="name"></h2><p id="description"></p><p><b>插入位置</b><br><span id="use"></span></p><small>原图像素做连续形变，不再轮播整张姿态图。当前是二维动作试演，尚未补画完整骨骼与口型。</small></aside></div><p><a href="../lecture-motion/examples/transformer-v3/watch.html">返回口播配套画面预览 →</a></p></main><script src="actor.js"></script><script src="actions.js"></script></html>
