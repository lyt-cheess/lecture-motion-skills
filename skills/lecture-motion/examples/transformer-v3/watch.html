<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曦曦 · 动效预演</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeaf5;color:#000;font:16px "PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}main{width:min(100%,560px);padding:12px}iframe{width:100%;aspect-ratio:3/4;border:0;background:white;display:block;max-height:calc(100vh - 132px)}.controls{padding:14px 0;display:flex;align-items:center;gap:12px}button{background:#e1d4ff;color:black;border:1px solid #000;border-radius:9px;padding:9px 16px;font:inherit;cursor:pointer}input{flex:1;accent-color:#8054e8;min-width:50px}p{font-size:13px;line-height:1.6;margin:0}output{min-width:52px;font-variant-numeric:tabular-nums}</style><main><iframe id="frame" src="index.html" title="曦曦原图动态预演"></iframe><div class="controls"><button id="play">播放</button><input id="seek" type="range" min="0" max="39.99" step="0.01" value="0"><output id="time">0.0秒</output><button id="restart">重播</button></div><p>公式 · 代码 · 图解联动 v3 · 1080×1440 · 沿用原版运动，增强技术表达<br>时间为临时编排；配音和嘴形同步另行制作。</p></main><script>
const frame=document.getElementById('frame'),play=document.getElementById('play'),seek=document.getElementById('seek'),out=document.getElementById('time');let running=false,current=0,clock=0;
function draw(){if(frame.contentWindow.READY)frame.contentWindow.render(current);seek.value=current;out.value=current.toFixed(1)+'秒';}
function tick(now){if(!running)return;current=Math.min(39.99,current+(now-clock)/1000);clock=now;draw();if(current>=39.99){running=false;play.textContent='播放';}else requestAnimationFrame(tick);}
play.onclick=()=>{running=!running;play.textContent=running?'暂停':'播放';if(running){clock=performance.now();requestAnimationFrame(tick);}};
seek.oninput=()=>{current=Number(seek.value);clock=performance.now();draw();};document.getElementById('restart').onclick=()=>{current=0;clock=performance.now();draw();if(!running)play.click();};frame.onload=()=>{const poll=setInterval(()=>{if(frame.contentWindow.READY){clearInterval(poll);draw();}},100);};
</script></html>
